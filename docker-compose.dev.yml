services:
  postgres:
    image: postgres:16-alpine
    container_name: movie-szn-pg
    restart: unless-stopped
    # 5433 on the host to avoid colliding with any existing pg / ssh tunnel on 5432
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: dave
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: moviereviews
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dave -d moviereviews']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
